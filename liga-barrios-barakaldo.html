<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Liga de Barrios de Barakaldo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b26;--steel:#2e4057;--rust:#c0572b;--ria:#3b7d7a;--paper:#efe3c8;--gold:#e9b949;--edge:#5b5670;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{height:100vh;height:100dvh;margin:0;overflow:hidden;background:#000;color:var(--paper);font-family:"Pixelify Sans",ui-monospace,"Courier New",monospace;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:none}
#wrap{position:fixed;inset:0;overflow:hidden;background:#000}
#safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:var(--st) var(--sr) var(--sb) var(--sl)}
#tx{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
#cv{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.hide{display:none!important}
.px{background:#1d1b26e6;border:2px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 0 2px var(--edge),0 0 0 2px #efe3c833,0 4px 0 #0006}
button{font:inherit;font-size:16px;color:var(--paper);background:var(--steel);border:2px solid var(--ink);border-radius:6px;box-shadow:inset 0 2px 0 #ffffff30,inset 0 -3px 0 #00000055,0 3px 0 var(--ink);padding:7px 10px;cursor:pointer;touch-action:manipulation;text-shadow:1px 1px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #ffffff30,0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45}
button.on{background:var(--rust)}
#pad{position:absolute;inset:0;pointer-events:none;z-index:2}
#pad button{pointer-events:auto;opacity:.35;transition:opacity .1s;touch-action:none}
#pad button.on,#pad button:active{opacity:.7;transform:none}
#dp{position:absolute;left:calc(var(--sl) + 10px);bottom:calc(var(--sb) + 14px);display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);grid-template-areas:". u ." "l . r" ". d ."}
#dp button{font-size:20px;padding:0;border-radius:10px;background:#2a2733}
#bA,#bB{position:absolute;border-radius:50%;font-weight:700}
#bA{right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 64px);width:74px;height:74px;background:var(--rust);font-size:26px}
#bB{right:calc(var(--sr) + 96px);bottom:calc(var(--sb) + 22px);width:60px;height:60px;background:#2a2733;font-size:20px}
#bM{position:absolute;right:calc(var(--sr) + 10px);top:calc(var(--st) + 10px);font-size:14px;padding:6px 12px;background:var(--ria)}
#bSnd{position:absolute;left:calc(var(--sl) + 8px);top:calc(var(--st) + 10px);z-index:3;font-size:13px;padding:3px 8px;opacity:.5}
#bPause{position:absolute;right:calc(var(--sr) + 4px);top:calc(var(--st) + 1px);z-index:3;font-size:12px;padding:1px 8px;opacity:.7}
#mpad{position:absolute;inset:0;pointer-events:none;z-index:2}
#mpad button{position:absolute;pointer-events:auto;border-radius:50%;opacity:.6;touch-action:none;font-weight:700;padding:0;font-size:13px;box-shadow:inset 0 3px 0 #ffffff40,inset 0 -4px 0 #0005,0 3px 0 var(--ink)}
#mpad img{width:70%;height:70%;image-rendering:pixelated;pointer-events:none}
#mpad button.on{opacity:.95;transform:translateY(2px)}#mpad button.off{filter:grayscale(1);opacity:.35}
#mS{right:calc(var(--sr) + 16px);bottom:calc(var(--sb) + 62px);width:76px;height:76px;background:var(--rust)}
#mP{right:calc(var(--sr) + 100px);bottom:calc(var(--sb) + 18px);width:64px;height:64px;background:#2e6f9e}
#mX{right:calc(var(--sr) + 22px);bottom:calc(var(--sb) + 152px);width:52px;height:52px;background:#7b4fa0;font-size:22px!important}
#dlg{position:absolute;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + 10px);z-index:6;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:inset 0 0 0 2px #fff8,inset 0 -4px 0 #c9b98f,0 0 0 3px var(--paper),0 0 0 6px var(--ink);padding:10px 12px 12px;font-size:17px;line-height:1.3;min-height:74px;animation:up .15s}
#dlgC{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#dlgC .more{position:absolute;right:10px;bottom:4px;color:var(--rust);animation:b .8s steps(2) infinite}
@keyframes b{50%{opacity:0}}@keyframes up{from{transform:translateY(12px);opacity:0}}@keyframes fin{from{opacity:0}}@keyframes grow{from{width:0}}
@media (prefers-reduced-motion:reduce){#dlgC .more,#dlg,#ov{animation:none}}
#panel{position:absolute;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + 10px);z-index:4;display:flex;flex-direction:column;gap:6px;max-height:58%;overflow:auto;padding:10px;background:#1d1b26e0;border:2px solid var(--ink);border-radius:8px;box-shadow:inset 0 0 0 2px var(--edge),0 0 0 2px #efe3c833;animation:up .15s}
.ptitle{font-size:16px;color:var(--gold);text-shadow:1px 1px 0 var(--ink)}
.prow{display:flex;gap:8px;flex-wrap:wrap}.prow button{flex:1}
.act{min-height:60px;font-size:17px}.act small{font-size:12px;opacity:.85}
.plist{display:flex;flex-direction:column;gap:6px}.plist button{text-align:left;display:flex;align-items:center;gap:6px;font-size:16px}
.plist img{width:32px;height:32px;image-rendering:pixelated}
.hint{font-size:16px;color:#b9b2a2;line-height:1.35}
#ov{position:absolute;inset:0;z-index:5;background:#221f2cf2;color:var(--paper);overflow:auto;padding:calc(var(--st) + 12px) calc(var(--sr) + 12px) calc(var(--sb) + 24px) calc(var(--sl) + 12px);touch-action:pan-y;animation:fin .2s}
#ov.clear{background:linear-gradient(#1d1b26ee,#1d1b2699 55%,transparent 75%)}
#ov>*{max-width:520px;margin-left:auto;margin-right:auto}
#ov h1{font-size:44px;line-height:1;margin:30px 0 4px;color:var(--gold);text-shadow:3px 3px 0 var(--rust),6px 6px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
#ov h2{font-size:24px;margin:4px 0 6px;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}#ov h3{font-size:17px;margin:10px 0 4px;color:#9fc6d6;text-shadow:1px 1px 0 var(--ink)}
#ov .sub{font-size:18px;color:#9fc6d6;margin:0 0 22px}#ov .warn{color:#e0552b}#ov .tiny{font-size:13px;color:#b9b2a2;margin-top:14px}
#ov .title{display:flex;flex-direction:column;gap:12px}#ov .big{font-size:20px;padding:10px}
#ov input,#ov select{font:inherit;font-size:18px;padding:6px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink)}#ov input#tl{width:70px}
#ov .col{display:flex;flex-direction:column;gap:8px}#ov .row{display:flex;gap:8px;margin-top:12px}#ov .row button{flex:1}
#ov .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ov .zb{font-size:15px;border-width:3px;background:#35323f}
#ov .info{font-size:14px;color:#d8cfbb;margin:2px 0 6px}#ov small{color:#b9b2a2}#ov ul{margin:4px 0;padding-left:20px;font-size:14px}
.card{display:flex;gap:8px;align-items:center;background:#35323f;border:2px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge),inset 0 -3px 0 #0004;padding:4px 8px;margin:5px 0;font-size:16px;cursor:pointer;flex:1}
.card img{width:64px;height:64px;image-rendering:pixelated;flex:none;margin:-6px -4px}.card.big img{width:96px;height:96px}.card.sel{border-color:var(--gold);background:#4a4452}.card i{color:var(--gold);font-style:normal}
.slot{display:flex;align-items:center;gap:6px}.slot>span{color:var(--gold);width:14px}.mini{font-size:13px;padding:4px 7px}
.chip{display:inline-block;font-size:11px;padding:0 5px;border-radius:4px;color:#1d1b26;box-shadow:inset 0 -1px 0 #0003}
.sb{display:grid;grid-template-columns:78px 1fr 26px;gap:6px;align-items:center;font-size:13px;margin:2px 0}.sb div,.xpb{height:8px;background:#1d1b26;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px #000}.sb i,.xpb i{display:block;height:100%;background:linear-gradient(#a8ef8a,#6fcf57 50%,#3f9a35);animation:grow .6s ease-out}
.xpb{margin:3px 0 6px}.xpb i{background:linear-gradient(#bfe6ff,#4fb0e8 50%,#2f6fb0)}
.tech{font-size:14px;color:var(--gold)}.xp{font-size:13px;color:#d8cfbb}
.item{background:#35323f;border:2px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 0 1px var(--edge);padding:8px;margin:6px 0;font-size:15px}.item button{margin-top:6px}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dx{background:#35323f;border-radius:6px;padding:4px;text-align:center;font-size:12px;line-height:1.2}.dx img{width:64px;height:64px;image-rendering:pixelated}.dx.no img{filter:brightness(0)}
.mini-team img{width:48px;height:48px;image-rendering:pixelated}
.score{font-size:28px;text-align:center;margin:6px 0;text-shadow:2px 2px 0 var(--ink)}
.albh{display:flex;justify-content:space-between;align-items:center;border-left:6px solid;padding-left:8px;margin-bottom:6px}
.badge{width:48px;height:48px;image-rendering:pixelated}.badge.empty{display:inline-block;border:2px dashed #5b5670;border-radius:50%;width:28px;height:28px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.badges img{width:32px;height:32px;image-rendering:pixelated}
.dx.seen img{filter:grayscale(1) brightness(.7)}.dx.gold{box-shadow:0 0 0 2px #f5d142;animation:gold 1s steps(2) infinite}@keyframes gold{50%{box-shadow:0 0 0 2px #fff7c2,0 0 8px #f5d142}}
.item.combo{border-color:#f5d142}.item.combo.lock{opacity:.6}.plist button.combo{background:linear-gradient(90deg,#7b4fa0,#c0572b);box-shadow:inset 0 0 0 2px #f5d142,0 3px 0 #1d1b26}
.map{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:180/200}.map>img{width:100%;height:100%;image-rendering:pixelated;display:block}
.mz{position:absolute;padding:0;font-size:11px;background:transparent;border:2px solid transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:1px 1px 0 #1d1b26}
.mz img{width:26px;height:26px;image-rendering:pixelated}.mz i{font-style:normal;font-size:16px}.mz b{position:absolute;top:0;right:3px;color:#f5d142;font-size:16px}.mz.sel{border-color:#fff}.mz.center{pointer-events:none}
.mz.pulse{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{border-color:#f5d142;box-shadow:0 0 12px #f5d142}}
.me{position:absolute;color:#e0552b;font-size:14px;transform:translate(-50%,-50%);text-shadow:0 0 3px #fff}
.med.m1{color:#c9894a}.med.m2{color:#cfd8db}.med.m3{color:#f5d142}.rain{margin:6px 0;padding:6px;border-radius:6px;background:#2e4057;font-size:13px}
.dup{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:#e9b949;color:#1d1b26;font-size:13px;font-weight:700}
.rw{font-size:18px;padding:12px}.rw.main{background:linear-gradient(#4f9e3e,#2d6a2a);box-shadow:inset 0 0 0 2px #f5d142,0 3px 0 #1d1b26}
.xpbig{height:14px;background:#1d1b26;border-radius:4px;overflow:hidden;margin:8px 0}.xpbig i{display:block;height:100%;background:linear-gradient(#bfe6ff,#4fb0e8 50%,#2f6fb0);transition:width 1.4s ease-out}
.rwb{font-size:17px;padding:10px;text-align:left}.taste{color:#e9b949!important}
.credits{text-align:center}.roll p{margin:6px 0;font-size:16px}.champ{color:var(--gold);font-size:20px!important;margin-top:18px!important}
</style>
</head>
<body>
<div id="wrap">
  <div id="safe"></div>
  <canvas id="cv" width="176" height="208"></canvas>
  <canvas id="tx"></canvas>
  <div id="pad">
    <div id="dp">
      <button data-d="3" style="grid-area:u" aria-label="Arriba">▲</button>
      <button data-d="1" style="grid-area:l" aria-label="Izquierda">◀</button>
      <button data-d="2" style="grid-area:r" aria-label="Derecha">▶</button>
      <button data-d="0" style="grid-area:d" aria-label="Abajo">▼</button>
    </div>
    <button id="bB">B</button><button id="bA">A</button><button id="bM">MENÚ</button>
  </div>
  <button id="bSnd" aria-label="Silencio">♪</button><button id="bPause" class="hide" aria-label="Pausa">II</button>
  <div id="mpad" class="hide"><button id="mP" aria-label="Pase"><img id="mPi" alt=""></button><button id="mS" aria-label="Tiro"><img id="mSi" alt=""></button><button id="mX" aria-label="Supertécnica"><img id="mXi" alt=""></button></div>
  <div id="dlg" class="hide"><div id="dlgT"></div><div id="dlgC"></div></div>
  <div id="panel" class="hide"></div>
  <div id="ov" class="hide"></div>
</div>

    if(u&&l&&K(x+1,y+1)===c&&K(x+2,y+2)===c)f=1.55;else if(u||l)f=1.2;else if(K(x,y+1)!==c||K(x+1,y)!==c)f=.68;else if(K(x,y+2)!==c||K(x+2,y)!==c)f=.84;

// Ramiro y el Capataz (look.spr) son sprites fijos propios. dir: 0 abajo, 1 izquierda, 2 derecha, 3 arriba; fr: 0 quieto, 1 y 3 pasos.

// ---- Criaturas (PixelLab) ----
// Cada forma es un PNG de 32×32 generado con PixelLab (SPR "c_<forma>", en el <script> de sprites). A 24 px se reduce
// por color dominante: con el vecino más cercano se perdían filas y columnas enteras del contorno.

function genZone(i){

    for(let y=0;y<5;y++)for(let x=0;x<5;x++)set(nx+x,ny+y,(x===0||y===0||x===4||y===4)?"T":",");
    const e={l:[0,2],r:[4,2]}[side],o={l:[-1,2],r:[5,2]}[side];

      const x0=q.x+1,y0=q.y+1,hx=q.x+q.w-4;

      set(x0+2,y0+2,"b");set(hx+1,y0+2,i===S.home?"h":"#");
      for(let x=q.x;x<q.x+q.w;x++)set(x,y0+3,".");
      set(q.x,y0+4,"S");
      if(q.h>=10)for(let y=y0+6;y<y0+8;y++){for(let x=q.x+1;x<q.x+4;x++)set(x,y,"#");for(let x=q.x+6;x<q.x+9;x++)set(x,y,"#");}

      sp.bar={x:ox+x0+2,y:oy+y0+2};sp.house={x:ox+hx+1,y:oy+y0+2};sp.sign={x:ox+q.x,y:oy+y0+4};
    }else{
      const a={x:q.x+1,y:q.y+1,w:q.w-2,h:q.h-2},half=Math.floor(a.w/2);
      const spec=role==="d1"?(Z.monte?"^":Z.indus?"%":'"'):'"';
      for(let y=a.y;y<a.y+a.h;y++)for(let x=a.x;x<a.x+a.w;x++){let c=x<a.x+half?'"':spec;if(c==="^"&&R()<.1)c="R";set(x,y,c);}

        const px=a.x+a.w-2,py=a.y+1;set(px,py,"P");set(px-1,py,"R");set(px,py+1,"^");set(px-1,py+1,"^");set(px-2,py+1,"^");

  const n=npcAt(nx,ny);if(n&&!n.tmp){lockDir=true;if(n.kind==="roam"){startRecruit(n.c,{roam:n,wild:true});return true;}if(n.look)n.dir=[3,2,1,0][P.dir];interactNpc(n);return true;}

}
function updateWorld(){
  roamUpdate(1/60);const spd=P.run?3.2:1.6;
  if(P.mv>0){P.mv-=spd;if(P.mv<=0){P.mv=0;onStep();}return;}
  if(busy())return;
  // Páginas del álbum completadas fuera del mapa (p. ej. al fichar): antes se quedaban en S.pendPage y el aviso no salía nunca.
  if(S.pendPage!=null){(S.pendPages=S.pendPages||[]).push(S.pendPage);delete S.pendPage;}
  if(S.pendPages&&S.pendPages.length&&!TR){const id=S.pendPages.shift(),pg=albPages().find(p=>p.id===id);if(pg)return pageAnim(pg);}
  const d=heldDir();if(d<0){lockDir=false;return;}if(lockDir)return;
  P.dir=d;const nx=P.x+DIRS[d][0],ny=P.y+DIRS[d][1];
  if(tryInteract(nx,ny))return;
  if(npcAt(nx,ny)||solid(tileAt(nx,ny),nx,ny))return;
  P.x=nx;P.y=ny;P.mv=16;
}
function onStep(){

  const it=ITEMS.find(i=>i.x===P.x&&i.y===P.y&&itemVis(i));if(it)return pickItem(it);
  const t=tileAt(P.x,P.y);

}

  if(S.act===0&&S.tut===1&&n.kind!=="cap"&&!S.tutTalk.includes(n.id)){S.tutTalk.push(n.id);const k=S.tutTalk.length;const go=()=>{if(k<3)say([`(Vecinos saludados: ${k}/3)`],tutCheck);else tutCheck();};
    if(n.kind==="talk")return say(n.lines,go);return say(["Vecino: ¡Aupa! ¿Tú eres el nuevo? Suerte con el fútbol, chaval."],go);}
  if(n.kind==="giver")return S.act===0?say(["Vecino: Cuando termines lo de tu mentor, tendré un reto para ti."]):mgTalk(n.z,n.k);
  if(n.kind==="talk")return say(n.lines);
  if(n.kind==="amis"&&S.act===0)return say(["Kuadrilla: Primero termina el entrenamiento con tu mentor, y luego echamos un amistoso."]);
  if(n.kind==="amis"){const Z=DATA.zones[n.z];return ask(`${Z.amis}: ¿Echamos un amistoso? Si empatamos, no pasa nada.`,["¡Vamos!","Ahora no"],i=>{if(i)return;S.amisN=(S.amisN||0)+1;startMatchFlow(amisTeam(n.z),{kind:"amis",canDraw:true,onEnd:()=>{}});});}
  if(n.kind==="coach")return S.act===0&&S.tut<3?say(["Entrenador: Aún no te toca entrenar. Haz caso a tu mentor."]):trainingMenu(!!n.tut);
  if(n.kind==="capataz")return say(["Capataz: ¿Vienes a por la revancha? Venga, que tengo prisa."],()=>capatazMatch(S.capPend));
  if(n.kind==="excl")return say([`${DATA.sp[n.sp].n[0]} te mira desafiante. Quiere ver si mereces ser su nuevo equipo.`],()=>startRecruit(newCre(n.sp,45,"n"),{special:n.sp}));
  if(n.kind==="srare")return say([`¡Un ${DATA.sp[n.sp].n[0]} te observa desde aquí! Parece que ha oído hablar de tus medallas.`],()=>{const r=rnd();startRecruit(newCre(n.sp,clamp(avgLvl()+2,5,nextRivalLvl()+4),r<.05?"d":r<.25?"r":"n"),{special:"sr_"+n.sp,respKey:n.sp});});

}

function newGame(name,home,sp){
  ovHide();UID=1;S=freshState(name,home);S.act=0;S.tut=1;S.unlocked=[home];
  const Z=DATA.zones[home],commons=Object.keys(DATA.sp).filter(k=>DATA.sp[k].r==="común"&&!DATA.sp[k].st);
  const por=newCre(commons.filter(k=>DATA.sp[k].pos==="POR")[0],4,"n"),own=commons.filter(k=>DATA.sp[k].t===Z.t&&DATA.sp[k].pos!=="POR");
  const pool=own.length>=2?own:commons.filter(k=>DATA.sp[k].pos!=="POR"),st=newCre(sp,5,"n");
  [por,newCre(pick(commons.filter(k=>DATA.sp[k].pos==="DEF")),3,"n"),newCre(pool[0],3,"n"),st,newCre(pool[1%pool.length],4,"n")].forEach(addCre);

const PNH={};let PNI=0;

// ================= LUZ (hora del día) =================
// El sol sale a las 7 por la izquierda (este), a mediodía está alto por arriba y se pone a las 21 por la derecha.
// LT.l = dirección hacia el sol en la vista (las sombras van al revés), LT.len = largo de sombra por px de altura,
// LT.col = color de la luz, LT.amb = tinte ambiente (se multiplica), LT.night = 0..1 (focos encendidos por encima de ~.3).
// La hora es la del reloj del jugador; ?hora=19.5 en la URL la fija (para probar).
const HORA_URL=(()=>{try{const v=new URLSearchParams(location.search).get("hora");return v==null||v===""?null:+v;}catch(e){return null;}})();
let LT=null,LTh=-1;
function hourNow(){if(HORA_URL!=null&&isFinite(HORA_URL))return((HORA_URL%24)+24)%24;const d=new Date();return d.getHours()+d.getMinutes()/60;}
function mixC(a,b,k){const p=hex(a),q=hex(b);return"#"+[0,1,2].map(i=>Math.round(p[i]+(q[i]-p[i])*k).toString(16).padStart(2,"0")).join("");}
function lightAt(h){
  const t=(h-7)/14,up=t>0&&t<1,el=up?Math.sin(Math.PI*t):0; // elevación 0..1
  // noche: 0 de día, 1 de noche cerrada; transición de 45 min en el ocaso y el alba
  const night=h>=21.75||h<6.25?1:h>=21?(h-21)/.75:h<7?(7-h)/.75:0;
  const gold=up?clamp(1-el/.6,0,1):1; // luz dorada cerca del horizonte
  const ax=up?-Math.cos(Math.PI*t):0,l=[ax,-.55],ln=Math.hypot(l[0],l[1]);

function clauseP(bonus){const F=DATA.fichaje;return Math.max(0,Math.round(Math.min(95,E.conf*(F.fac[rarF(E.foe)]||.6)+bonus)-(E.foe.rar==="d"?F.gold:0)));}

function resize(){
  const vw=window.innerWidth,vh=window.innerHeight,dpr=window.devicePixelRatio||1;SCALE=Math.max(1,Math.floor(Math.min(vw/180,vh/280)));
  // DECISIÓN: en el partido táctil el lienzo usa píxeles físicos: cada píxel del sprite mide k píxeles físicos (entero, nítido) y el
  // jugador ocupa ~10 % del lado corto de la pantalla. Antes (zoom ×2) el campo se veía pequeño respecto a los jugadores.
  if(MSC&&TOUCH&&dpr>=1.5){const k=Math.max(2,Math.round(Math.min(vw,vh)*.1*dpr/24));SCALE=k/dpr;}
  txtResize();
  // Mínimo 1×1: con la ventana a 0×0 (pestaña en segundo plano) drawImage del campo lanzaba InvalidStateError en cada frame.
  W=Math.max(1,Math.ceil(vw/SCALE));H=Math.max(1,Math.ceil(vh/SCALE));cv.width=W;cv.height=H;cv.style.width=W*SCALE+"px";cv.style.height=H*SCALE+"px";ctx.imageSmoothingEnabled=false;
  const cs=getComputedStyle($("safe"));SAFE={t:Math.ceil(parseFloat(cs.paddingTop)/SCALE)||0,b:Math.ceil(parseFloat(cs.paddingBottom)/SCALE)||0,l:Math.ceil(parseFloat(cs.paddingLeft)/SCALE)||0,r:Math.ceil(parseFloat(cs.paddingRight)/SCALE)||0};
  if(M)onResizeMatch();
}

    else if(scene==="title"){drawTitleBg();}
